<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HD Honey &infin;</title>
    <link rel="icon" href="./images/HD-MAKEUPICO.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>
    <div class="container">
        <div class="charclogin"></div>
        <div class="form-p">
            <p class="hd title">HD Honey &infin;</p>
            <p class="title">👋 Hi!</p>
            <form action="./register.html" method="post">
                <input type="text" placeholder="Username" name="user" maxlength="30" required>
                <div class="password-box">
                    <input type="password" class="password" placeholder="Password" name="password" minlength="8" required>
                    <span class="toggle"><i class="fa-solid fa-eye" onclick="togglePassword(this)"></i></span>
                </div>
                <div class="buttons">
                    <button type="submit">Login</button>
                    <button type="reset">Reset</button>
                </div>
                <div class="fa-go">
                    <div class="go coo">
                        <!-- <i class="fa-brands fa-google"></i> -->
                        <img src="images/google.png" alt="logo-google">
                        <button class="google-btn co-button">Google</button>
                    </div>
                    <div class="fa coo">
                        <img src="images/facebook.png" alt="logo-facebook">
                        <button class="faceboook-btn co-button">Facebook</button>
                    </div>
                </div>
                <div class="rememberMe">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember Me</label>
                </div>
                <a href="./forgotpassword.html" class="forgot">Forgot password</a>
                <p class="registeraccount">Don't have an account? <a href="./register.html" class="register">Register</a></p>
            </form>
        </div>
    </div>
    <script src="./scripts/showpassword.js"></script>
</body>
</html>
